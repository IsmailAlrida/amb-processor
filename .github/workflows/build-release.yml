name: Build and Release AMB Assembler

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_bump:
        description: "Release bump to build and publish; use none for smoke only."
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  OSS_CAD_SUITE_VERSION: "2026-04-18"

jobs:
  smoke:
    name: Smoke
    if: >-
      ${{
        !startsWith(github.ref, 'refs/tags/v') &&
        (
          github.event_name != 'workflow_dispatch' ||
          github.event.inputs.release_bump == 'none'
        )
      }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-smoke-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Run smoke checks
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests
          python -m assembler --self-test

  release_meta:
    name: Release Metadata
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') ||
        (
          github.event_name == 'workflow_dispatch' &&
          (
            github.event.inputs.release_bump == 'patch' ||
            github.event.inputs.release_bump == 'minor' ||
            github.event.inputs.release_bump == 'major'
          )
        )
      }}
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      build_version: ${{ steps.version.outputs.build_version }}
      target_sha: ${{ steps.version.outputs.target_sha }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
            build_version="${release_tag#v}"
          else
            bump="${{ github.event.inputs.release_bump }}"
            latest="$(
              git tag -l 'v[0-9]*.[0-9]*.[0-9]*' |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -n 1 || true
            )"
            if [[ -n "${latest}" ]]; then
              IFS=. read -r major minor patch <<< "${latest#v}"
            else
              major=0
              minor=0
              patch=0
            fi

            case "${bump}" in
              patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                raise_error="Unsupported release bump: ${bump}"
                echo "${raise_error}" >&2
                exit 1
                ;;
            esac

            release_tag="v${major}.${minor}.${patch}"
            build_version="${major}.${minor}.${patch}"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "build_version=${build_version}"
            echo "target_sha=${GITHUB_SHA}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release tag: ${release_tag}"
          echo "Build version: ${build_version}"

  build:
    name: Build ${{ matrix.platform }}
    if: ${{ needs.release_meta.outputs.release_tag != '' }}
    needs: release_meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            frozen_exe: dist/amb-assembler/amb-assembler
            artifact_name: amb-assembler-linux-x64
          - os: windows-2025
            platform: windows-x64
            frozen_exe: dist/amb-assembler/amb-assembler.exe
            artifact_name: amb-assembler-windows-x64
          - os: macos-14
            platform: darwin-arm64
            frozen_exe: dist/amb-assembler.app/Contents/MacOS/amb-assembler
            artifact_name: amb-assembler-darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
            frozen_exe: dist/amb-assembler.app/Contents/MacOS/amb-assembler
            artifact_name: amb-assembler-darwin-x64

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set build version
        run: |
          echo "BUILD_VERSION=${{ needs.release_meta.outputs.build_version }}" >> "${GITHUB_ENV}"
          echo "Build version: ${{ needs.release_meta.outputs.build_version }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            patchelf \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0
          gcc --version

      - name: Verify macOS compiler
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          xcode-select -p
          clang --version

      - name: Verify Windows compiler
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) {
            throw "MSVC Build Tools not found"
          }
          cmd /c "call `"$install\Common7\Tools\VsDevCmd.bat`" -arch=x64 && cl"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Install OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE_VERSION }}
          github-token: ${{ github.token }}

      - name: Locate OSS CAD Suite
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          tool = shutil.which("iverilog") or shutil.which("iverilog.exe")
          if tool is None:
              raise SystemExit("iverilog not found on PATH after setup-oss-cad-suite")

          root = Path(tool).resolve().parent.parent
          print(f"AMB_OSS_CAD_SUITE_SOURCE_ROOT={root}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"AMB_OSS_CAD_SUITE_SOURCE_ROOT={root}\n")
          PY

      - name: Build PyInstaller bundle
        run: |
          python -m PyInstaller --noconfirm --clean amb-assembler.spec

      - name: Run frozen RTL smoke
        if: ${{ !startsWith(matrix.platform, 'darwin-') }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "${{ matrix.frozen_exe }}" --self-test-rtl

      - name: Run macOS frozen RTL smoke from spaced app path
        if: startsWith(matrix.platform, 'darwin-')
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf "dist/smoke"
          mkdir -p "dist/smoke"
          ditto "dist/amb-assembler.app" "dist/smoke/amb-assembler 2.app"
          env -u AMB_OSS_CAD_SUITE_ROOT "dist/smoke/amb-assembler 2.app/Contents/MacOS/amb-assembler" --self-test-rtl

      - name: Install Inno Setup
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $installerDir = Join-Path $pwd "dist\installer"
          if (Test-Path $installerDir) {
            Remove-Item -Recurse -Force $installerDir
          }
          New-Item -ItemType Directory -Path $installerDir | Out-Null
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC.exe not found after Inno Setup install"
          }
          & $iscc /Qp "/DMyRepoRoot=$pwd" "/O$installerDir" "/Famb-assembler-windows-x64-$env:BUILD_VERSION-setup" simcompile.iss

      - name: Package Linux artifact
        if: matrix.platform == 'linux-x64'
        run: |
          mkdir -p "dist/artifacts"
          tar -czf "dist/artifacts/amb-assembler-linux-x64-${BUILD_VERSION}.tar.gz" -C dist amb-assembler

      - name: Package macOS DMG
        if: startsWith(matrix.platform, 'darwin-')
        run: |
          rm -rf "dist/dmg-root"
          mkdir -p "dist/artifacts" "dist/dmg-root"
          ditto "dist/amb-assembler.app" "dist/dmg-root/amb-assembler.app"
          ln -s /Applications "dist/dmg-root/Applications"
          hdiutil create \
            -volname "AMB Assembler" \
            -srcfolder "dist/dmg-root" \
            -ov \
            -format UDZO \
            "dist/artifacts/amb-assembler-${{ matrix.platform }}-${BUILD_VERSION}.dmg"

      - name: Package Windows artifact
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $artifactDir = Join-Path $pwd "dist\artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $installer = Get-ChildItem "dist\installer" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Inno Setup installer not found in dist\installer"
          }
          Copy-Item $installer.FullName (Join-Path $artifactDir "amb-assembler-windows-x64-$env:BUILD_VERSION-setup.exe") -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ needs.release_meta.outputs.release_tag != '' }}
    needs:
      - release_meta
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release_meta.outputs.release_tag }}
          TARGET_SHA: ${{ needs.release_meta.outputs.target_sha }}
        run: |
          echo "Publishing ${RELEASE_TAG} for ${GH_REPO} at ${TARGET_SHA}"
          if ! compgen -G "release-artifacts/*" >/dev/null; then
            echo "No release artifacts found in release-artifacts" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-artifacts/* --clobber --repo "${GH_REPO}"
          else
            gh release create "${RELEASE_TAG}" release-artifacts/* \
              --repo "${GH_REPO}" \
              --target "${TARGET_SHA}" \
              --title "${RELEASE_TAG}" \
              --notes "Automated AMB Assembler build for ${RELEASE_TAG} at ${TARGET_SHA}."
          fi
